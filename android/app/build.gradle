apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// FCM: must come after the Android application plugin. Reads android/app/google-services.json.
apply plugin: "com.google.gms.google-services"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
// Play Console: ship R8 minify/shrink on release AABs by default (opt-out via gradle.properties).
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: 'true').toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Expo uses the `expo.jsEngine` Gradle property to select the JS engine.
// Default to Hermes to match modern Expo/RN defaults.
def hermesEnabled = (findProperty('expo.jsEngine') ?: 'hermes').toString() == 'hermes'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.blyp.mobile'
    defaultConfig {
        applicationId 'com.blyp.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2026315361
        versionName "1.0.24"
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def getPropOrEnv = { String name ->
                return (project.findProperty(name) ?: System.getProperty(name) ?: System.getenv(name))
            }

            def allowDebugSignedRelease = {
                def v = (project.findProperty('BLYP_ALLOW_DEBUG_SIGNED_RELEASE') ?: System.getenv('BLYP_ALLOW_DEBUG_SIGNED_RELEASE') ?: '').toString().toLowerCase()
                return ['1', 'true', 'yes'].contains(v)
            }

            def pickFirstNonEmpty = { List<String> names ->
                for (def n : names) {
                    def v = getPropOrEnv(n)
                    if (v != null) {
                        def s = v.toString().trim()
                        if (s.length() > 0) {
                            return s
                        }
                    }
                }
                return null
            }

            // Local: BLYP_RELEASE_* (env/gradle.properties)
            // EAS/CI: Android Gradle Plugin supports injected signing properties:
            // - android.injected.signing.store.file
            // - android.injected.signing.store.password
            // - android.injected.signing.key.alias
            // - android.injected.signing.key.password
            def storeFilePath = pickFirstNonEmpty([
                    'BLYP_RELEASE_STORE_FILE',
                    'android.injected.signing.store.file',
                    'ANDROID_KEYSTORE_PATH',
                    'ANDROID_KEYSTORE_FILE'
            ])
            def storePasswordValue = pickFirstNonEmpty([
                    'BLYP_RELEASE_STORE_PASSWORD',
                    'android.injected.signing.store.password',
                    'ANDROID_KEYSTORE_PASSWORD',
                    'ANDROID_STORE_PASSWORD'
            ])
            def keyAliasValue = pickFirstNonEmpty([
                    'BLYP_RELEASE_KEY_ALIAS',
                    'android.injected.signing.key.alias',
                    'ANDROID_KEY_ALIAS',
                    'ANDROID_ALIAS'
            ])
            def keyPasswordValue = pickFirstNonEmpty([
                    'BLYP_RELEASE_KEY_PASSWORD',
                    'android.injected.signing.key.password',
                    'ANDROID_KEY_PASSWORD',
                    'ANDROID_KEYSTORE_KEY_PASSWORD'
            ])

            // EAS writes credentials.json before gradlew.
            def credentialsJson = rootProject.file('../credentials.json')
            if ((!storeFilePath || !storePasswordValue || !keyAliasValue || !keyPasswordValue) && credentialsJson.exists()) {
                def credentials = new groovy.json.JsonSlurper().parse(credentialsJson)
                def ks = credentials?.android?.keystore
                if (ks?.keystorePath && ks?.keystorePassword && ks?.keyAlias) {
                    def keystorePath = java.nio.file.Paths.get(ks.keystorePath as String)
                    storeFilePath = (keystorePath.isAbsolute()
                        ? keystorePath
                        : rootProject.file('..').toPath().resolve(keystorePath)).toFile().absolutePath
                    storePasswordValue = ks.keystorePassword
                    keyAliasValue = ks.keyAlias
                    keyPasswordValue = ks.keyPassword ?: ks.keystorePassword
                }
            }

            def resolvedStoreFile = storeFilePath ? file(storeFilePath) : null

            if (storeFilePath && (!resolvedStoreFile || !resolvedStoreFile.exists())) {
                println "WARNING: Release keystore file not found at: ${storeFilePath}"
            }

            if (resolvedStoreFile && resolvedStoreFile.exists() && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile resolvedStoreFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else if (allowDebugSignedRelease()) {
                println 'WARNING: Release signing not configured; using debug keystore for this release build (local testing only).'
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.getByName('debug')
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            // Always attach the release signingConfig; we enforce presence later
            // (after project evaluation) so EAS can inject signing config.
            signingConfig signingConfigs.release
            // Resource shrink is optional; minify (R8) is the Play Console recommendation.
            // Keep shrink off by default to avoid AGP linked-resources races on Windows.
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Fail-fast for release builds *after* the project is evaluated so EAS Build can
// inject signing config into build.gradle. Canonical Play uploads must come
// through the guarded release script with explicit version intent.
def isReleaseTaskRequested = {
    def tasks = gradle.startParameter.taskNames ?: []
    return tasks.any { (it ?: '').toString().toLowerCase().contains('release') }
}

def isCanonicalReleaseRequested = {
    def raw = (project.findProperty('BLYP_CANONICAL_RELEASE') ?: System.getenv('BLYP_CANONICAL_RELEASE') ?: '').toString().toLowerCase()
    return ['1', 'true', 'yes'].contains(raw)
}

def isAllowDebugSignedRelease = {
    def v = (project.findProperty('BLYP_ALLOW_DEBUG_SIGNED_RELEASE') ?: System.getenv('BLYP_ALLOW_DEBUG_SIGNED_RELEASE') ?: '').toString().toLowerCase()
    return ['1', 'true', 'yes'].contains(v)
}

def isLocalDeviceReleaseRequested = {
    def raw = (project.findProperty('BLYP_LOCAL_DEVICE_RELEASE') ?: System.getenv('BLYP_LOCAL_DEVICE_RELEASE') ?: '').toString().toLowerCase()
    return ['1', 'true', 'yes'].contains(raw)
}

def isAssembleReleaseOnly = {
    def tasks = gradle.startParameter.taskNames ?: []
    return tasks.any { (it ?: '').toString().toLowerCase().contains('assemblerelease') }
}

def getExpectedReleaseVersionCode = {
    return (project.findProperty('BLYP_EXPECTED_VERSION_CODE') ?: System.getenv('BLYP_EXPECTED_VERSION_CODE') ?: '').toString().trim()
}

afterEvaluate {
    if (isReleaseTaskRequested()) {
        // Fast path: local adb smoke with bundled JS (debug-signed APK, no Play ledger).
        if (isLocalDeviceReleaseRequested() && isAssembleReleaseOnly()) {
            if (!isAllowDebugSignedRelease()) {
                throw new RuntimeException(
                        'Local device release requires BLYP_ALLOW_DEBUG_SIGNED_RELEASE=1 (debug-signed APK for adb only).'
                )
            }
            println 'INFO: BLYP_LOCAL_DEVICE_RELEASE - assembleRelease for adb smoke (skips canonical Play gates).'
            return
        }

        def easBuildProfile = (System.getenv('EAS_BUILD_PROFILE') ?: '').toString().trim().toLowerCase()
        if (easBuildProfile == 'production') {
            throw new RuntimeException(
                    'Release build blocked. EAS production build profile is NON-CANONICAL and must not be used for Play-upload AAB release. Use tools/release/BUILD_RELEASE_CANDIDATE.ps1.'
            )
        }

        // Internal EAS APK profiles are device-smoke builds, not Play-upload candidates.
        if (easBuildProfile == 'preview' || easBuildProfile == 'preview-staging') {
            println "INFO: EAS profile '${easBuildProfile}' - skipping canonical Play release gates."
            return
        }

        if (!isCanonicalReleaseRequested()) {
            throw new RuntimeException(
                    'Release build blocked. Use tools/release/BUILD_RELEASE_CANDIDATE.ps1 with BLYP_CANONICAL_RELEASE=1.'
            )
        }

        def expectedVersionCode = getExpectedReleaseVersionCode()
        if (!expectedVersionCode) {
            throw new RuntimeException(
                    'Release build blocked. Set BLYP_EXPECTED_VERSION_CODE to the intended versionCode before running a canonical release build.'
            )
        }

        def androidExt = project.extensions.findByName('android')
        def actualVersionCode = androidExt?.defaultConfig?.versionCode?.toString()
        if (actualVersionCode != expectedVersionCode) {
            throw new RuntimeException(
                    "Release build blocked. versionCode mismatch: expected ${expectedVersionCode}, actual ${actualVersionCode}."
            )
        }

        // Anti-reuse guard: a versionCode that has already been built for upload
        // must NEVER be rebuilt - Google Play rejects duplicate version codes.
        // Every release build records its code in tools/release/built_versioncodes.txt
        // (committed, durable memory). To build again you MUST allocate a fresh,
        // strictly-increasing code via tools/release/bump_version_code.ps1.
        def builtLedgerFile = new File(projectRoot, 'tools/release/built_versioncodes.txt')
        if (builtLedgerFile.exists()) {
            def consumedCodes = builtLedgerFile.readLines()
                    .collect { (it ?: '').trim() }
                    .findAll { it ==~ /\d+/ }
            if (consumedCodes.contains(actualVersionCode)) {
                throw new RuntimeException(
                        "Release build blocked. versionCode ${actualVersionCode} has already been built/uploaded " +
                        "(recorded in tools/release/built_versioncodes.txt). Run tools/release/bump_version_code.ps1 " +
                        "to allocate a fresh versionCode, then rebuild."
                )
            }
        }

        def releaseStoreFile = androidExt?.signingConfigs?.findByName('release')?.storeFile
        if (releaseStoreFile == null) {
            throw new RuntimeException(
                    'Release signing is not configured. ' +
                            'Set BLYP_RELEASE_STORE_FILE, BLYP_RELEASE_STORE_PASSWORD, BLYP_RELEASE_KEY_ALIAS, BLYP_RELEASE_KEY_PASSWORD via gradle.properties or environment variables.'
            )
        }

        if (releaseStoreFile.name?.equalsIgnoreCase('debug.keystore')) {
            throw new RuntimeException('Debug keystore cannot be used for canonical release builds.')
        }

        // Record this versionCode as consumed as soon as a release artifact is
        // produced, so the anti-reuse guard above blocks any future rebuild of
        // the same code - on this machine or any other (the file is committed).
        def builtRecorder = tasks.register('recordBuiltVersionCode') {
            doLast {
                builtLedgerFile.parentFile.mkdirs()
                def already = builtLedgerFile.exists() ?
                        builtLedgerFile.readLines().collect { (it ?: '').trim() } : []
                if (!already.contains(actualVersionCode)) {
                    builtLedgerFile << "${actualVersionCode}${System.lineSeparator()}"
                    println "Recorded built versionCode ${actualVersionCode} in tools/release/built_versioncodes.txt"
                }
            }
        }
        tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }
                .configureEach { finalizedBy(builtRecorder) }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.android.billingclient:billing-ktx:7.1.1")
    // Explicit so BlypCallMessagingService can compile (Expo only brings this transitively).
    implementation("com.google.firebase:firebase-messaging:24.1.1")
    // enableEdgeToEdge / SystemBarStyle (Android 15 deprecated window color APIs).
    implementation("androidx.activity:activity-ktx:1.9.3")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Amazon IVS SDKs for real-time streaming
    implementation "com.amazonaws:ivs-player:1.47.0"
    // Real-Time Stage SDK (Stage classifier). If this fails to resolve, fall back to 1.16.0:stages@aar
    implementation "com.amazonaws:ivs-broadcast:1.37.0:stages@aar"
    // implementation "com.amazonaws:ivs-broadcast:1.16.0:stages@aar"
}

if (file("./eas-build.gradle").exists()) {
    apply from: "./eas-build.gradle"
}

