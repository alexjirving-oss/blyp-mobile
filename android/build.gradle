// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // FCM: processes android/app/google-services.json so the client can fetch a
    // device push token for the blyp-master Firebase project.
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Some Expo modules read `project(':app').hermesEnabled` during configuration.
// Define it early and derive from Expo's `expo.jsEngine` property (defaults to Hermes).
def expoJsEngine = (findProperty('expo.jsEngine') ?: 'hermes').toString()
def resolvedHermesEnabled = (expoJsEngine == 'hermes')
def appProject = findProject(':app')
if (appProject != null) {
  appProject.ext.set('hermesEnabled', resolvedHermesEnabled)
}
