<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <!--
    Screenshot frame template (optional):
    - Take REAL screenshots from your device (required by Play).
    - Drop the screenshot under the frame group in an SVG editor (Inkscape/Figma).
    - Export to PNG/JPG.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1242" height="2688" fill="url(#bg)"/>

  <!-- Headline area -->
  <text x="621" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="64" font-weight="800" fill="#FFFFFF">Blyp</text>
  <text x="621" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="500" fill="#E2E8F0">Internal testing</text>

  <!-- Phone frame -->
  <g filter="url(#shadow)">
    <rect x="121" y="420" width="1000" height="2100" rx="90" fill="#0B1020" opacity="0.55"/>
    <rect x="156" y="470" width="930" height="2000" rx="70" fill="#0B1020"/>
    <rect x="180" y="520" width="882" height="1900" rx="56" fill="#111827"/>

    <!-- Drop your real screenshot here (clip to the screen area) -->
    <clipPath id="screen">
      <rect x="180" y="520" width="882" height="1900" rx="56"/>
    </clipPath>
    <!-- Example placeholder (remove/replace with your real screenshot image) -->
    <rect x="180" y="520" width="882" height="1900" rx="56" fill="#0F172A" clip-path="url(#screen)"/>

    <!-- Small camera cutout -->
    <circle cx="621" cy="510" r="10" fill="#0B1020"/>
  </g>

  <!-- Footer tagline -->
  <text x="621" y="2600" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="30" font-weight="600" fill="#FFFFFF">Create posts • Discover • Go live</text>
</svg>
