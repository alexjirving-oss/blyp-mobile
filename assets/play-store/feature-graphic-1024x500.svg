<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="accent" cx="28%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Solid background (no transparency) -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#accent)"/>

  <!-- Blyp icon (matches screenshot style) -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="308" height="308" rx="78" fill="#8B5CF6"/>
    <text x="250" y="312"
      text-anchor="middle"
      font-family="ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial"
      font-size="190"
      font-weight="800"
      fill="#FFFFFF">B</text>
  </g>

  <!-- Text block -->
  <g filter="url(#shadow)">
    <text x="456" y="210" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Blyp</text>
    <text x="456" y="276" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="34" font-weight="600" fill="#E5E7EB">Create posts • Discover • Go live</text>
    <text x="456" y="326" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="500" fill="#9CA3AF">Internal testing</text>
  </g>

  <!-- Subtle bottom shape -->
  <path d="M0 420 C 220 360, 360 520, 590 460 C 770 412, 900 396, 1024 410 L 1024 500 L 0 500 Z" fill="#8B5CF6" opacity="0.18"/>
</svg>
