<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1020" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Solid background (no transparency) -->
  <rect width="512" height="512" fill="#7C3AED"/>

  <!-- Blyp-style rounded square icon plate -->
  <g filter="url(#shadow)">
    <rect x="86" y="86" width="340" height="340" rx="88" fill="#8B5CF6"/>
  </g>

  <!-- White "B" mark (simple + bold, matches screenshot style) -->
  <g filter="url(#shadow)">
    <text x="256" y="332"
      text-anchor="middle"
      font-family="ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial"
      font-size="228"
      font-weight="800"
      fill="#FFFFFF">B</text>
  </g>
</svg>
