<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background (solid; no transparency) -->
  <rect width="2560" height="1600" fill="url(#bg)"/>
  <rect width="2560" height="1600" fill="url(#purpleGlow)"/>

  <!-- Center logo plate -->
  <g filter="url(#shadow)">
    <rect x="1000" y="420" width="560" height="560" rx="140" fill="#8B5CF6"/>
    <text x="1280" y="840"
      text-anchor="middle"
      font-family="ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial"
      font-size="360"
      font-weight="800"
      fill="#FFFFFF">B</text>
  </g>

  <!-- Optional subtle label (kept minimal) -->
  <text x="1280" y="1150" text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
    font-size="72" font-weight="700" fill="#FFFFFF" opacity="0.95">Blyp</text>

  <!-- Safe margin guide (hidden). Set opacity to 0.25 to preview. -->
  <g opacity="0" pointer-events="none">
    <rect x="0" y="0" width="2560" height="1600" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
    <rect x="160" y="160" width="2240" height="1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="18 18"/>
  </g>
</svg>
