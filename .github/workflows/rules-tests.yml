name: Firestore & Storage Rules Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Rules Tests (Firestore + Storage)
        env:
          FIREBASE_PROJECT_ID: demo-blyp-livestream
        run: |
          firebase emulators:exec --only firestore,storage "npm run test:rules" || exit 1

      - name: Archive Test Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -R backup/rules || true
          echo "Finished" > artifacts/summary.txt
        
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-test-summary
          path: artifacts
