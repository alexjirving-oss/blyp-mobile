name: Firebase Security Rules Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Firebase Tools
        run: npm install --global firebase-tools@14.18.0

      - name: Run strict Firestore and Storage rules tests
        env:
          CI: true
          FIREBASE_PROJECT_ID: demo-blyp-livestream
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: true
        run: firebase emulators:exec --non-interactive --only firestore,storage "npm run test:rules"

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-rules-emulator-diagnostics
          path: |
            firestore-debug.log
            storage-debug.log
            ui-debug.log
          if-no-files-found: ignore
          retention-days: 7
