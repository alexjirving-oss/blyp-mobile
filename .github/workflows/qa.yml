name: QA
on: [push, pull_request]
jobs:
  # Code gate (AGENTS.md): lint + typecheck + jest + functions + backend + admin.
  # Replaces the broken prod_audit path under gitignored `_reports/`.
  verified-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify:forward

  accountability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/accountability/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix tools/accountability
      - run: npm test --prefix tools/accountability
      - run: npm run accountability:test-hooks
