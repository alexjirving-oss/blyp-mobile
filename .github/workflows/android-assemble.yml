name: Android Assemble Gate

on:
  push:
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.js'
      - 'app.json'
      - 'patches/**'
      - '.github/workflows/android-assemble.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.js'
      - 'app.json'
      - 'patches/**'
      - '.github/workflows/android-assemble.yml'
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Expo Doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
