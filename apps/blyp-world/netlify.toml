# Static export + Netlify Functions (reliable CLI deploy).
[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Pretty routes → static shells (client reads the real path segment).
[[redirects]]
  from = "/v/*"
  to = "/v/_/"
  status = 200

[[redirects]]
  from = "/u/*"
  to = "/u/_/"
  status = 200

# Watch shells for /live/:sessionId (exclude directory + studio via specificity)
[[redirects]]
  from = "/live/studio"
  to = "/live/studio/"
  status = 200
  force = true

[[redirects]]
  from = "/live/:id"
  to = "/live/_/"
  status = 200

[[redirects]]
  from = "/api/wallet/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
