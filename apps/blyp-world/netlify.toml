# Static export + Netlify Functions (reliable CLI deploy).
[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"


# App home is For You (static export cannot emit Next redirect as HTTP).
[[redirects]]
  from = "/"
  to = "/foryou/"
  status = 302
  force = true
# Share links (/p/:id) → OG function (crawlers) / 302 to /v/:id (humans).
# Must stay above the static /p shell rewrite.
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/share-post"
  status = 200
  force = true

# Pretty routes → static shells (client reads the real path segment).
[[redirects]]
  from = "/v/*"
  to = "/v/_/"
  status = 200

# Fallback shell if function is unavailable (deploy without force above).
[[redirects]]
  from = "/p/*"
  to = "/p/_/"
  status = 200

[[redirects]]
  from = "/u/*"
  to = "/u/_/"
  status = 200

# Watch shells for /live/:sessionId (exclude directory + studio via specificity)
[[redirects]]
  from = "/live/studio"
  to = "/live/studio/"
  status = 200
  force = true

[[redirects]]
  from = "/live/blyp-studio"
  to = "/live/blyp-studio/"
  status = 200
  force = true

[[redirects]]
  from = "/live/:id"
  to = "/live/_/"
  status = 200

[[redirects]]
  from = "/api/wallet/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/auth/firebase-token"
  to = "/.netlify/functions/mint-firebase-token"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
