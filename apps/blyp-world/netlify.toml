# Static export + Netlify Functions (reliable CLI deploy).
[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  external_node_modules = ["@netlify/blobs"]


# `/` is LIVE Studio (static export). Do not force-redirect home to For You.
# Share links (/p/:id) → OG function (crawlers) / 302 to /v/:id (humans).
# Must stay above the static /p shell rewrite.
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/share-post"
  status = 200
  force = true

# Pretty routes → static shells (client reads the real path segment).
[[redirects]]
  from = "/v/*"
  to = "/v/_/"
  status = 200

# Fallback shell if function is unavailable (deploy without force above).
[[redirects]]
  from = "/p/*"
  to = "/p/_/"
  status = 200

[[redirects]]
  from = "/u/*"
  to = "/u/_/"
  status = 200

# Watch shells for /live/:sessionId (exclude directory + studio via specificity)
# Pretty routes → static shells (client reads the real path segment).
[[redirects]]
  from = "/live/studio/cam-test"
  to = "/live/studio/cam-test/"
  status = 200
  force = true

[[redirects]]
  from = "/live/studio/overlay"
  to = "/live/studio/overlay/"
  status = 200
  force = true

[[redirects]]
  from = "/live/studio/deck"
  to = "/live/studio/deck/"
  status = 200
  force = true

[[redirects]]
  from = "/live/studio"
  to = "/live/studio/"
  status = 200
  force = true

[[redirects]]
  from = "/live/blyp-studio"
  to = "/live/blyp-studio/"
  status = 200
  force = true

[[redirects]]
  from = "/live/:id"
  to = "/live/_/"
  status = 200

[[redirects]]
  from = "/api/wallet/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/auth/firebase-token"
  to = "/.netlify/functions/mint-firebase-token"
  status = 200

[[redirects]]
  from = "/api/spotify"
  to = "/.netlify/functions/spotify-link"
  status = 200

[[redirects]]
  from = "/api/spotify/*"
  to = "/.netlify/functions/spotify-link"
  status = 200

[[redirects]]
  from = "/api/live/overlay-feed"
  to = "/.netlify/functions/overlay-feed"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ivs/*/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ivs/*/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/amazon-ivs-service-worker-loader.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
